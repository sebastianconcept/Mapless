# Replica-set Mongo code is excluded from the reported percentage; it is not run in CI.
ignore:
  - "**/Manifest*.st"
  - "**/*ReplicaSet*.st"

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 70%

comment:
  layout: "reach,diff,flags,tree"
